<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostWizard Media Automator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'space': ['Space Grotesk', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-space">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-gray-900 text-white py-4">
            <div class="container mx-auto px-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold">PostWizard Media Automator</h1>
                <div class="relative" id="profileDropdown">
                    <button class="flex items-center focus:outline-none" id="profileButton">
                        <i class="fas fa-user-circle text-2xl text-white"></i> <!-- Font Awesome Profile Icon -->
                        <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    
                    <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg hidden" id="profileMenu">
                        <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                        <a href="/setting" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-4 py-8">
            <div class="bg-white rounded-lg shadow-lg p-6 max-w-3xl mx-auto">
                <div class="space-y-6">
                    <!-- Photo Upload -->
                    <div class="photo-upload">
                        <label for="photoInput" class="block text-sm font-medium text-gray-700 mb-2">Upload Photos</label>
                        <input type="file" id="photoInput" accept="image/*" multiple
                               class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-gray-200 file:text-gray-700 hover:file:bg-gray-300">
                        <div id="photoContainer" class="mt-4 grid grid-cols-3 gap-4"></div>
                    </div>

                    <!-- Caption -->
                    <div class="text-content">
                        <label for="caption" class="block text-sm font-medium text-gray-700 mb-2">Caption</label>
                        <textarea id="caption" placeholder="Write your caption here..." rows="4"
                                  class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-500 transition duration-200"></textarea>
                    </div>

                    <!-- Social Media Selection -->
                    <div class="social-media-selection flex space-x-4">
                        <label for="linkedinCheckbox" class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="linkedinCheckbox" value="LinkedIn" class="form-checkbox h-5 w-5 text-gray-600">
                            <i class="fab fa-linkedin text-2xl text-gray-700"></i>
                            <span class="text-sm text-gray-700">LinkedIn</span>
                        </label>
                        <label for="twitterCheckbox" class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="twitterCheckbox" value="Twitter" class="form-checkbox h-5 w-5 text-gray-600">
                            <i class="fab fa-twitter text-2xl text-gray-700"></i>
                            <span class="text-sm text-gray-700">Twitter</span>
                        </label>
                    </div>

                    <!-- Post Button -->
                    <button id="postButton"
                            class="w-full bg-gray-800 text-white py-3 rounded-lg hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition duration-200">
                        Post
                    </button>

                    <!-- Upload Status and Link Container -->
                    <div id="uploadStatus" class="text-blue-600 font-bold text-center hidden">Uploading...</div>
                    <div id="linkContainer" class="mt-4"></div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-gray-900 text-white py-4">
            <div class="container mx-auto px-4 text-center">
                <p>&copy; 2023 PostWizard. All rights reserved.</p>
            </div>
        </footer>
    </div>
    <script>
        // Profile dropdown functionality
        const profileButton = document.getElementById('profileButton');
        const profileMenu = document.getElementById('profileMenu');

        profileButton.addEventListener('click', () => {
            profileMenu.classList.toggle('hidden');
        });

        // Close the dropdown when clicking outside
        document.addEventListener('click', (event) => {
            if (!profileDropdown.contains(event.target)) {
                profileMenu.classList.add('hidden');
            }
        });
    </script>
    <script src="../static/script.js"></script>
</body>
</html>
