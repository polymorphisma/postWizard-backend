<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - PostWizard Media Automator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'space': ['Space Grotesk', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-space">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-gray-900 text-white py-4">
            <div class="container mx-auto px-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold">PostWizard Media Automator</h1>
                <div class="relative" id="profileDropdown">
                    <button class="flex items-center focus:outline-none" id="profileButton">
                        <i class="fas fa-user-circle text-2xl text-white"></i> <!-- Font Awesome Profile Icon -->
                        <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg hidden" id="profileMenu">
                        <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                        <a href="/setting" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-4 py-8">
            <div class="bg-white rounded-lg shadow-lg p-6 max-w-3xl mx-auto">
                <h2 class="text-2xl font-bold mb-6">Settings</h2>
                
                <!-- Change Username -->
                <div class="mb-8">
                    <h3 class="text-xl font-semibold mb-4">Change Username</h3>
                    <form id="changeUsernameForm" class="space-y-4">
                        <div>
                            <label for="newUsername" class="block text-sm font-medium text-gray-700 mb-1">New Username</label>
                            <input type="text" id="newUsername" name="newUsername" required
                                   class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-500 transition duration-200">
                        </div>
                        <button type="submit" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition duration-200">
                            Change Username
                        </button>
                    </form>
                </div>

                <!-- Change Password -->
                <div class="mb-8">
                    <h3 class="text-xl font-semibold mb-4">Change Password</h3>
                    <form id="changePasswordForm" class="space-y-4">
                        <div>
                            <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-1">Current Password</label>
                            <input type="password" id="currentPassword" name="currentPassword" required
                                   class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-500 transition duration-200">
                        </div>
                        <div>
                            <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                            <input type="password" id="newPassword" name="newPassword" required
                                   class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-500 transition duration-200">
                        </div>
                        <div>
                            <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required
                                   class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-500 transition duration-200">
                        </div>
                        <button type="submit" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition duration-200">
                            Change Password
                        </button>
                    </form>
                </div>

                <!-- Social Media Connectors -->
                <div>
                    <h3 class="text-xl font-semibold mb-4">Connect Social Media Accounts</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <button id="connectLinkedIn" class="flex items-center justify-center space-x-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200">
                            <i class="fab fa-linkedin text-2xl"></i>
                            <span>Connect LinkedIn</span>
                        </button>
                        <button id="connectTwitter" class="flex items-center justify-center space-x-2 bg-blue-400 text-white px-4 py-2 rounded-lg hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-2 transition duration-200">
                            <i class="fab fa-twitter text-2xl"></i>
                            <span>Connect Twitter</span>
                        </button>
                        <button id="connectFacebook" class="flex items-center justify-center space-x-2 bg-blue-800 text-white px-4 py-2 rounded-lg hover:bg-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-700 focus:ring-offset-2 transition duration-200">
                            <i class="fab fa-facebook text-2xl"></i>
                            <span>Connect Facebook</span>
                        </button>
                        <button id="connectInstagram" class="flex items-center justify-center space-x-2 bg-pink-600 text-white px-4 py-2 rounded-lg hover:bg-pink-700 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:ring-offset-2 transition duration-200">
                            <i class="fab fa-instagram text-2xl"></i>
                            <span>Connect Instagram</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-gray-900 text-white py-4">
            <div class="container mx-auto px-4 text-center">
                <p>&copy; 2023 PostWizard. All rights reserved.</p>
            </div>
        </footer>
    </div>
    <script type="module" src="../static/change_password.js"></script>

    <script>
        // Profile dropdown functionality
        const profileButton = document.getElementById('profileButton');
        const profileMenu = document.getElementById('profileMenu');

        profileButton.addEventListener('click', () => {
            profileMenu.classList.toggle('hidden');
        });

        // Close the dropdown when clicking outside
        document.addEventListener('click', (event) => {
            if (!profileDropdown.contains(event.target)) {
                profileMenu.classList.add('hidden');
            }
        });

        // Form submission handlers (you'll need to implement the actual functionality)
        document.getElementById('changeUsernameForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Implement username change logic here
            console.log('Change username submitted');
        });

        document.getElementById('changePasswordForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Implement password change logic here
            console.log('Change password submitted');
        });

        // Social media connection handlers (you'll need to implement the actual OAuth flow)
        document.getElementById('connectLinkedIn').addEventListener('click', () => {
            // Implement LinkedIn OAuth flow
            console.log('Connect LinkedIn clicked');
        });

        document.getElementById('connectTwitter').addEventListener('click', () => {
            // Implement Twitter OAuth flow
            console.log('Connect Twitter clicked');
        });

        document.getElementById('connectFacebook').addEventListener('click', () => {
            // Implement Facebook OAuth flow
            console.log('Connect Facebook clicked');
        });

        document.getElementById('connectInstagram').addEventListener('click', () => {
            // Implement Instagram OAuth flow
            console.log('Connect Instagram clicked');
        });
    </script>
</body>
</html>
