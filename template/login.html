<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Geometric</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'space': ['Space Grotesk', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-space">
    <div class="min-h-screen flex flex-col md:flex-row-reverse">
        <!-- Geometric Pattern Side -->
        <div class="md:w-1/2 bg-gray-800 flex items-center justify-center p-12">
            <div class="w-full max-w-md">
                <div class="text-white text-4xl font-bold mb-8">Welcome Back</div>
                <div class="grid grid-cols-3 gap-4">
                    <div class="h-32 bg-gray-700 rounded-tl-full"></div>
                    <div class="h-32 bg-gray-600"></div>
                    <div class="h-32 bg-gray-500 rounded-tr-full"></div>
                    <div class="h-32 bg-gray-600"></div>
                    <div class="h-32 bg-gray-500 rounded-full"></div>
                    <div class="h-32 bg-gray-400"></div>
                    <div class="h-32 bg-gray-500 rounded-bl-full"></div>
                    <div class="h-32 bg-gray-400"></div>
                    <div class="h-32 bg-gray-300 rounded-br-full"></div>
                </div>
            </div>
        </div>

        <!-- Form Side -->
        <div class="md:w-1/2 bg-white flex items-center justify-center p-12">
            <div class="w-full max-w-md">
                <h1 class="text-4xl font-bold text-gray-800 mb-8">Login</h1>
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input type="text" id="username" name="username" required
                               class="w-full px-4 py-3 bg-gray-100 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-gray-500 transition duration-200">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="password" name="password" required
                               class="w-full px-4 py-3 bg-gray-100 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-gray-500 transition duration-200">
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox" 
                                   class="h-4 w-4 text-gray-600 focus:ring-gray-500 border-gray-300 rounded">
                            <label for="remember-me" class="ml-2 block text-sm text-gray-700">
                                Remember me
                            </label>
                        </div>
                        <div class="text-sm">
                            <a href="#" class="font-medium text-gray-600 hover:text-gray-500">
                                Forgot your password?
                            </a>
                        </div>
                    </div>
                    <button type="submit"
                            class="w-full bg-gray-800 text-white py-3 rounded-lg hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition duration-200">
                        Sign in
                    </button>
                </form>
                
                <!-- Message container for errors/success -->
                <div id="messageContainer" class="mt-4 text-center text-sm font-medium"></div>

                <p class="mt-8 text-center text-sm text-gray-600">
                    Don't have an account? 
                    <a href="/register" class="font-medium text-gray-800 hover:underline">Register here</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module" src="../static/login.js"></script>
</body>
</html>
